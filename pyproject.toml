[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-pmc"
version = "0.1.0"
authors = [
    { name = "django_PMC Maintainers" }
]
description = "Poor Man's Cron: Lightweight, ALB health check triggered scheduled tasks with DB locking for multi-container Django environments."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "django>=3.2"
]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/anchit92/Django-PMC"
Repository = "https://github.com/anchit92/Django-PMC.git"
"Bug Tracker" = "https://github.com/anchit92/Django-PMC/issues"

